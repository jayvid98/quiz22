<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="PNVN1631 Med-Surg Quiz 2">
<meta name="theme-color" content="#0b7285">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz #2">
<title>Quiz #2 — PNVN1631 Med-Surg | PVD & Respiratory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root{
  /* Palette: Sterile Aqua meets warm clinical white */
  --bg:          #e8f4f6;
  --surface:     #ffffff;
  --surface-off: #f0f8fa;
  --teal:        #0b7285;
  --teal2:       #0d8fa6;
  --teal3:       #12aac6;
  --teal-lt:     #cceef4;
  --teal-xlt:    #e5f7fb;
  --aqua:        #38bcd4;
  --navy:        #1a3c4e;
  --navy2:       #0e2a38;
  --slate:       #2d5060;
  --green:       #0e7c5a;
  --green2:      #16a37a;
  --green-lt:    #d1f5e8;
  --green-xlt:   #e8faf3;
  --red:         #c0392b;
  --red2:        #e74c3c;
  --red-lt:      #fde8e6;
  --red-xlt:     #fff5f4;
  --amber:       #b45309;
  --amber-lt:    #fef3c7;
  --gray:        #4a6572;
  --gray2:       #6b8a96;
  --gray-lt:     #eaf1f4;
  --border:      #b8d8e0;
  --border2:     #cde7ec;
  --text:        #0e2a38;
  --text2:       #2d5060;
  --text3:       #4a6572;
  --white:       #ffffff;
  --shadow-sm:   0 1px 3px rgba(11,114,133,.08), 0 1px 2px rgba(11,114,133,.05);
  --shadow:      0 2px 8px rgba(11,114,133,.10), 0 1px 3px rgba(11,114,133,.07);
  --shadow-md:   0 6px 20px rgba(11,114,133,.14), 0 2px 6px rgba(11,114,133,.08);
  --shadow-lg:   0 12px 40px rgba(11,114,133,.18);
  --r:           14px;
  --r-sm:        10px;
}

/* ── RESET & BASE ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes popIn{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes checkBounce{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fillBar{from{width:0}to{width:var(--target-w)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(11,114,133,.0)}50%{box-shadow:0 0 0 6px rgba(11,114,133,.12)}}

/* ── GATE ── */
#gate{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(150deg,#0e2a38 0%,#0b7285 45%,#12aac6 100%);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .4s ease;
}
.gate-card{
  background:#fff;border-radius:24px;
  padding:48px 44px 44px;
  width:min(420px,93vw);
  box-shadow:var(--shadow-lg);
  animation:fadeUp .5s cubic-bezier(.4,0,.2,1);
}
.gate-icon{
  width:76px;height:76px;border-radius:22px;
  background:linear-gradient(135deg,#0b7285,#12aac6);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:34px;
  box-shadow:0 8px 28px rgba(11,114,133,.38);
  animation:glow 3s ease-in-out infinite;
}
.gate-eyebrow{
  text-align:center;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal2);background:var(--teal-xlt);
  display:inline-block;padding:5px 16px;
  border-radius:20px;margin-bottom:12px;
}
.gate-wrap{text-align:center}
.gate-title{font-size:28px;font-weight:800;color:var(--navy);line-height:1.15;margin-bottom:6px}
.gate-sub{font-size:13.5px;color:var(--gray);line-height:1.55;margin-bottom:6px}
.gate-stat{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:600;color:var(--teal2);
  background:var(--teal-xlt);padding:5px 14px;
  border-radius:20px;margin-bottom:28px;
}
.gate-stat span{font-weight:800}
.gate-field label{
  display:block;font-size:12px;font-weight:700;
  color:var(--gray);text-align:left;margin-bottom:7px;
  letter-spacing:.04em;
}
.gate-input{
  font-family:'Courier New',monospace;
  font-size:26px;letter-spacing:.5em;text-align:center;
  width:100%;padding:14px 16px;
  border:2px solid var(--border);border-radius:12px;
  background:var(--surface-off);color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s;
  margin-bottom:14px;
}
.gate-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(11,114,133,.13)}
.gate-submit{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#0b7285,#12aac6);
  color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:800;letter-spacing:.03em;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 5px 18px rgba(11,114,133,.38);
}
.gate-submit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,114,133,.42)}
.gate-submit:active{transform:translateY(0)}
.gate-err{
  font-size:12.5px;color:var(--red);font-weight:700;
  text-align:center;margin-top:10px;display:none;
  animation:wrongShake .3s ease;
}

/* ── STICKY HEADER ── */
.app-header{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,var(--navy2) 0%,var(--teal) 100%);
  box-shadow:0 2px 16px rgba(11,114,133,.3);
}
.header-inner{padding:12px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-icon{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.brand-text h1{font-size:15px;font-weight:800;color:#fff;line-height:1.2}
.brand-text p{font-size:10.5px;color:rgba(255,255,255,.65);letter-spacing:.06em}
.score-bubble{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;padding:6px 16px;
  font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;transition:background .3s;
}
.score-bubble .hi{color:#a7f3d0;font-weight:800}

/* ── PROGRESS ── */
.progress-section{padding:0 20px 12px}
.prog-track{
  height:7px;
  background:rgba(255,255,255,.18);
  border-radius:7px;overflow:hidden;
}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,#38d9a9,#a7f3d0);
  border-radius:7px;
  transition:width .6s cubic-bezier(.4,0,.2,1);
}
.prog-labels{
  display:flex;justify-content:space-between;
  font-size:11px;color:rgba(255,255,255,.65);margin-top:5px;
}

/* ── FILTER BAR ── */
.filter-bar{
  background:#fff;
  border-bottom:2px solid var(--teal-lt);
  padding:10px 20px;
  display:flex;gap:7px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;
  font-size:12px;font-weight:600;
  padding:6px 15px;border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--surface-off);
  color:var(--gray);cursor:pointer;
  transition:all .18s;white-space:nowrap;
}
.chip:hover{border-color:var(--teal2);color:var(--teal2);background:var(--teal-xlt)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(11,114,133,.25)}


.q-img-wrap {
  margin-bottom: 16px;
  border-radius: 10px;
  overflow: hidden;
  border: 1.5px solid var(--border2);
  background: var(--surface-off);
}
.q-img-wrap img {
  width: 100%;
  height: auto;
  display: block;
}
.q-img-label {
  font-size: 11px; font-weight: 700;
  color: var(--teal2); letter-spacing: .08em;
  text-transform: uppercase;
  padding: 6px 12px;
  background: var(--teal-xlt);
  border-top: 1px solid var(--teal-lt);
}

/* ── SECTION HEADER (per topic) ── */
.section-header{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--teal) 100%);
  border-radius:var(--r);
  padding:14px 18px;
  margin-bottom:14px;
  margin-top:28px;
  box-shadow:var(--shadow);
  animation:fadeUp .4s ease;
}
.section-header:first-child{margin-top:0}
.section-icon{font-size:22px}
.section-info{flex:1}
.section-name{font-size:14px;font-weight:800;color:#fff;line-height:1.2}
.section-desc{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.section-badge{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  border-radius:20px;padding:4px 12px;
  font-size:12px;font-weight:800;color:#fff;
  white-space:nowrap;
}

/* ── MAIN ── */
.main{max-width:820px;margin:0 auto;padding:22px 18px 100px}

/* ── QUESTION CARD ── */
.q-card{
  background:#fff;
  border:1.5px solid var(--border2);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  margin-bottom:14px;
  overflow:hidden;
  transition:box-shadow .25s,border-color .25s;
  animation:fadeUp .4s ease backwards;
}
.q-card:hover{box-shadow:var(--shadow-md)}
.q-card.correct{border-color:#86efbf}
.q-card.wrong{border-color:#fca5a5;animation:wrongShake .35s ease}

/* Colored left stripe */
.q-accent{
  height:4px;
  background:linear-gradient(90deg,var(--teal),var(--aqua));
  transition:background .3s;
}
.q-card.correct .q-accent{background:linear-gradient(90deg,var(--green),#34d399)}
.q-card.wrong .q-accent{background:linear-gradient(90deg,var(--red),var(--red2))}

.q-inner{padding:20px 22px 22px}

/* Card header */
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-badge{
  width:32px;height:32px;border-radius:10px;
  background:var(--teal);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;
  flex-shrink:0;
  transition:background .3s;
}
.q-card.correct .q-badge{background:var(--green2);animation:popIn .4s ease}
.q-card.wrong .q-badge{background:var(--red2);animation:popIn .4s ease}
.q-meta{flex:1}
.q-section-tag{
  font-size:11px;font-weight:700;
  color:var(--teal2);letter-spacing:.08em;text-transform:uppercase;
}
.q-type-tag{
  display:inline-block;
  font-size:10px;font-weight:700;
  padding:2px 9px;border-radius:20px;
  background:var(--amber-lt);
  color:var(--amber);
  margin-left:6px;
  border:1px solid #fcd34d;
}

.q-text{
  font-size:15.5px;font-weight:700;
  color:var(--text);line-height:1.58;
  margin-bottom:16px;
}

/* SATA hint */
.sata-hint{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;color:var(--amber);
  background:var(--amber-lt);
  padding:7px 12px;border-radius:8px;
  border:1px solid #fcd34d;
  margin-bottom:13px;
}

/* ── OPTIONS ── */
.q-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:2px}

.opt{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:var(--surface-off);
  border:1.5px solid var(--border2);
  border-radius:var(--r-sm);
  cursor:pointer;
  text-align:left;width:100%;
  font-family:'Inter',sans-serif;
  font-size:14.5px;color:var(--text);
  line-height:1.45;
  transition:border-color .16s,background .16s,transform .12s,box-shadow .16s;
  position:relative;
  animation:slideIn .3s ease backwards;
}
.opt:nth-child(1){animation-delay:.05s}
.opt:nth-child(2){animation-delay:.1s}
.opt:nth-child(3){animation-delay:.15s}
.opt:nth-child(4){animation-delay:.2s}
.opt:nth-child(5){animation-delay:.25s}

.opt:hover:not(.locked){
  border-color:var(--teal2);
  background:var(--teal-xlt);
  transform:translateX(4px);
  box-shadow:0 2px 10px rgba(11,114,133,.1);
}
.opt.sel{
  border-color:var(--teal);
  background:var(--teal-xlt);
  box-shadow:0 0 0 3px rgba(11,114,133,.12);
}
.opt.is-correct{
  border-color:var(--green);
  background:var(--green-xlt);
  color:var(--green);
  font-weight:600;
  animation:fadeIn .3s ease;
}
.opt.is-wrong{
  border-color:var(--red);
  background:var(--red-xlt);
  color:var(--red);
}
.opt.locked{cursor:default;transform:none !important;box-shadow:none !important}

/* Option letter badge */
.opt-letter{
  flex-shrink:0;
  width:28px;height:28px;border-radius:8px;
  background:var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
  color:var(--gray);
  transition:all .18s;
}
.opt:hover:not(.locked) .opt-letter{background:var(--teal2);color:#fff}
.opt.sel .opt-letter{background:var(--teal);color:#fff}
.opt.is-correct .opt-letter{
  background:var(--green2);color:#fff;
  animation:checkBounce .4s cubic-bezier(.4,0,.2,1);
}
.opt.is-wrong .opt-letter{background:var(--red2);color:#fff}
.opt-text{flex:1}

/* ── SUBMIT BUTTON ── */
.submit-row{
  display:flex;align-items:center;gap:12px;margin-top:14px;
}
.submit-btn{
  padding:11px 24px;
  background:linear-gradient(135deg,var(--navy),var(--teal));
  color:#fff;border:none;border-radius:var(--r-sm);
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:.03em;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(11,114,133,.3);
  transition:opacity .2s,transform .15s,box-shadow .2s;
  white-space:nowrap;
}
.submit-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 18px rgba(11,114,133,.35)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{
  background:var(--gray-lt);color:var(--gray2);
  box-shadow:none;cursor:not-allowed;opacity:1;transform:none;
}
.submit-hint{font-size:12.5px;color:var(--gray2);font-style:italic}

/* ── RESULT BANNER ── */
.result-banner{
  display:none;
  margin-top:12px;padding:11px 16px;
  border-radius:var(--r-sm);
  font-size:14px;font-weight:700;
  align-items:center;gap:9px;
  line-height:1.4;
}
.result-banner.show{display:flex;animation:fadeUp .3s ease}
.correct-banner{background:var(--green-lt);color:var(--green);border:1.5px solid #86efbf}
.wrong-banner{background:var(--red-lt);color:var(--red);border:1.5px solid #fca5a5}

/* ── RATIONALE ── */
.rationale{
  display:none;margin-top:11px;
  padding:14px 17px;
  background:linear-gradient(135deg,#e0f4f8,#eafbff);
  border:1.5px solid var(--teal-lt);
  border-left:5px solid var(--teal3);
  border-radius:var(--r-sm);
  font-size:13.5px;color:var(--slate);line-height:1.68;
}
.rationale.show{display:block;animation:fadeUp .35s ease}
.rat-label{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--teal2);margin-bottom:8px;
}

/* ── RESULTS SCREEN ── */
.results-screen{display:none;padding:48px 20px;text-align:center}
.results-screen.show{display:block;animation:fadeUp .5s ease}
.results-emoji{font-size:60px;display:block;margin-bottom:10px;animation:popIn .6s ease}
.results-pct{
  font-size:76px;font-weight:800;
  background:linear-gradient(135deg,var(--teal),var(--aqua));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;margin-bottom:6px;
}
.results-label{font-size:16px;color:var(--gray);margin-bottom:32px}
.results-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:14px;max-width:380px;margin:0 auto 32px;
}
.rb{
  background:#fff;border:1.5px solid var(--border2);
  border-radius:var(--r);padding:20px 10px;
  box-shadow:var(--shadow);
  animation:fadeUp .5s ease backwards;
}
.rb:nth-child(1){animation-delay:.1s}
.rb:nth-child(2){animation-delay:.2s}
.rb:nth-child(3){animation-delay:.3s}
.rb-v{font-size:32px;font-weight:800;line-height:1}
.rb-l{font-size:11.5px;color:var(--gray);margin-top:3px;font-weight:600}
.rb.c .rb-v{color:var(--green2)}
.rb.w .rb-v{color:var(--red2)}
.rb.t .rb-v{color:var(--teal2)}
.restart-btn{
  background:linear-gradient(135deg,var(--navy),var(--teal));
  color:#fff;border:none;
  padding:16px 48px;border-radius:var(--r);
  font-family:'Inter',sans-serif;
  font-size:16px;font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(11,114,133,.38);
  transition:transform .15s,box-shadow .15s;
  animation:fadeUp .5s .4s ease backwards;
}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(11,114,133,.42)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);
  border-top:1.5px solid var(--border2);
  padding:10px 18px;
  display:flex;justify-content:center;gap:10px;
  box-shadow:0 -4px 20px rgba(11,114,133,.1);
}
.nav-btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px;font-weight:700;
  padding:10px 22px;border-radius:var(--r-sm);
  border:none;cursor:pointer;
  transition:all .16s;
}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{background:var(--teal);color:#fff;box-shadow:0 3px 10px rgba(11,114,133,.28)}
.nav-btn.primary:hover:not(:disabled){background:var(--navy);box-shadow:0 5px 16px rgba(11,114,133,.32)}
.nav-btn.secondary{background:var(--surface-off);color:var(--text2);border:1.5px solid var(--border)}
.nav-btn.secondary:hover:not(:disabled){border-color:var(--teal2);color:var(--teal2)}
.nav-btn.danger{background:#fde8e6;color:var(--red);border:1.5px solid #fca5a5}
.nav-btn.danger:hover{background:var(--red-lt);border-color:var(--red)}

@media(max-width:520px){
  .main{padding:16px 12px 96px}
  .q-inner{padding:16px 15px 18px}
  .q-text{font-size:14.5px}
  .opt{font-size:13.5px;padding:10px 13px}
  .results-pct{font-size:62px}
  .section-header{padding:12px 15px}
}
</style>
</head>
<body>

<!-- ── GATE ── -->
<div id="gate">
<div class="gate-card">
  <div class="gate-icon">🩺</div>
  <div class="gate-wrap">
    <div class="gate-eyebrow">PNVN1631 · Med-Surg I</div>
    <div class="gate-title">Quiz #2</div>
    <div class="gate-sub">Peripheral Vascular Diseases<br>Intro to Respiratory</div>
    <div class="gate-stat">📋 <span>49 questions</span> · SATA included · Rationales on every Q</div>
    <div class="gate-field">
      <label>PASSCODE</label>
      <input class="gate-input" type="password" id="pc" placeholder="••••" maxlength="6"
        onkeydown="if(event.key==='Enter')checkPC()" autocomplete="off">

<script>
const ALL_Q=[
{s:"Raynaud's",q:"What is the PRIMARY method to prevent Raynaud's episodes?",o:["a. Avoid caffeine only","b. Manage temperature: keep extremities warm","c. Take beta blockers daily","d. Elevate the affected limb"],a:"b",r:"Temperature management is the #1 prevention strategy. Cold exposure triggers vasospasm in Raynaud's disease, causing vessels in fingers and toes to suddenly constrict."},
{s:"Raynaud's",sata:1,q:"★ SATA: Which triggers make Raynaud's WORSE?",o:["a. Cold weather","b. Stress","c. Warm bath","d. Caffeine","e. Smoking"],a:"a,b,d,e",r:"Cold, stress, caffeine, and smoking all cause vasoconstriction and trigger episodes. A warm bath HELPS by warming extremities. All four listed are vasoconstrictors or stress inducers."},
{s:"Raynaud's",q:"A nurse is teaching a Raynaud's patient. Which instruction is INCORRECT?",o:["a. Use mittens in cold weather","b. Apply a heating pad to warm hands","c. Practice stress-reducing techniques","d. Complete smoking cessation"],a:"b",r:"Heating pads are NEVER recommended. Because circulation is impaired, sensation is also impaired: the patient cannot feel burns until too late. All other options are correct."},
{s:"Raynaud's",q:"A patient is experiencing an acute Raynaud's attack. Which intervention is most appropriate?",o:["a. Vigorously rub hands in ice or snow","b. Place hands in ice water to observe for pallor","c. Apply hot water over hands to rapidly warm them","d. Place mittens on hands and encourage patient to move fingers"],a:"d",r:"Gentle warming with mittens plus gentle movement promotes circulation safely. Hot water risks burns (impaired sensation). Ice directly triggers vasospasm. Vigorous rubbing can damage fragile tissue."},
{s:"Raynaud's",sata:1,q:"★ SATA: Which teaching points should be included for a patient with Raynaud's disease?",o:["a. Warming hands and feet with a heating pad","b. Using mittens in cold weather","c. Practicing stress-reducing techniques","d. Complete smoking cessation","e. Using caution when cleaning the refrigerator or freezer"],a:"b,c,d,e",r:"Mittens (b), stress reduction (c), smoking cessation (d), and caution near cold sources like refrigerators (e) are correct. Heating pad (a) is WRONG: burn risk due to impaired sensation."},
{s:"DVT",q:"A postsurgical patient has calf swelling. The nurse dorsiflexes the foot: calf pain results. This is:",o:["a. Crepitus: sign of a joint disorder","b. Positive Homan's Sign: suggests DVT","c. Rigidity: sign of ankylosis","d. Muscular spasm: sign of hypocalcemia"],a:"b",r:"Positive Homan's sign = calf pain on dorsiflexion → suggests DVT. Important: Homan's sign is UNRELIABLE and NOT specific for DVT. It's a screening tool only: confirm with Doppler ultrasound and D-dimer."},
{s:"DVT",q:"What is the most feared complication of untreated DVT?",o:["a. Stroke","b. Pulmonary Embolism (PE)","c. Heart failure","d. Renal failure"],a:"b",r:"DVT → Pulmonary Embolism (PE). The clot dislodges and travels to the lungs causing sudden chest pain, dyspnea, tachycardia. LIFE-THREATENING emergency: the primary reason DVT is treated so aggressively."},
{s:"DVT",q:"Which DVT discharge instruction is INCORRECT?",o:["a. No crossing legs","b. Increase fluid intake","c. Wear TED hose (compression stockings)","d. Remain on complete bed rest for 2 weeks"],a:"d",r:"Bed rest is WRONG and dangerous: immobility increases venous stasis. Patients should INCREASE exercise. Memory trick FTEN: Fluids up, TED hose, Exercise, No crossing legs."},
{s:"DVT",sata:1,q:"★ SATA: Which are correct DVT medications?",o:["a. Warfarin","b. Enoxaparin (Lovenox)","c. Aspirin as primary DVT treatment","d. Dalteparin (Fragmin)","e. Fondaparinux"],a:"a,b,d,e",r:"Warfarin, Enoxaparin, Dalteparin, and Fondaparinux are anticoagulants used for DVT. Aspirin is an antiplatelet: NOT a primary DVT treatment. Remember: anticoagulants prevent clot growth; thrombolytics (tPA, streptokinase) dissolve existing clots."},
{s:"DVT",sata:1,q:"★ SATA: Before administering Dalteparin (Fragmin), the nurse must complete:",o:["a. CBC (complete blood count)","b. Stool occult blood test","c. 12-lead ECG","d. Baseline vital signs","e. Urinalysis"],a:"a,b,d",r:"CBC checks blood counts, stool occult blood detects hidden GI bleeding, baseline vitals establish pre-medication baseline: all assess bleeding risk. ECG and urinalysis are not required pre-checks for this medication."},
{s:"DVT",sata:1,q:"★ SATA: Which interventions PREVENT venous stasis?",o:["a. Avoid crossing legs at the knee","b. Elevate legs when lying in bed or sitting","c. Wear elastic stockings when ambulating","d. Cross ankles instead of knees","e. Increase daily fluid intake"],a:"a,b,c",r:"No crossing legs (a), elevating legs (b), and elastic stockings (c) all promote venous return. Crossing ankles still compresses veins (d is wrong). Fluids help blood viscosity but don't mechanically prevent stasis."},
{s:"DVT",q:"A patient recovering from hip surgery needs DVT prevention. Which care plan aspect is best?",o:["a. Massaging the calves twice daily","b. Explaining fluid restriction after surgery","c. Assisting the patient to change positions frequently","d. Encouraging removal of anti-embolism stockings at night"],a:"c",r:"Frequent position changes promote venous return and prevent stasis. NEVER massage calves at DVT risk: you can dislodge a clot causing fatal PE. Stockings should stay ON. Fluid restriction increases viscosity and clot risk."},
{s:"DVT",sata:1,q:"★ SATA: The nurse suspects thrombophlebitis in the lower leg. Which symptoms would be assessed?",o:["a. Numbness along the vein","b. Severe cramping alone","c. Edema of the extremity","d. Calf warm to touch","e. Pain in the affected area"],a:"c,d,e",r:"Classic thrombophlebitis triad: edema (c), warmth/erythema (d), and pain (e). Numbness is more characteristic of arterial disorders. Cramping alone without other signs is not specific enough."},
{s:"DVT",q:"What is the hallmark primary symptom of Deep Vein Thrombosis (DVT)?",o:["a. Unilateral (one-sided) leg swelling","b. Bilateral leg swelling","c. Calf tenderness alone","d. Visible engorged cords under skin"],a:"a",r:"UNILATERAL leg swelling is the hallmark of DVT: the clot obstructs venous return on ONE side only. Bilateral swelling suggests systemic causes like heart failure. This distinction is clinically important."},
{s:"DVT",q:"A patient presents with unilateral leg swelling, warmth, and redness. What should be suspected and what action taken?",o:["a. DVT: give anticoagulants immediately without MD order","b. DVT: assess the patient for risk of pulmonary embolism","c. Thrombophlebitis: monitor for infection signs","d. Superficial thrombophlebitis: advise rest"],a:"b",r:"Unilateral swelling + warmth + redness = DVT until proven otherwise. IMMEDIATE priority = assess for PE. Anticoagulants require a physician order and confirmed diagnosis. Do NOT massage the leg."},
{s:"DVT",q:"What does calf tenderness indicate in the context of DVT diagnosis?",o:["a. Normal muscle strain or overuse injury","b. Inflammation and potential clot in deep veins","c. Infection in superficial veins","d. Fluid accumulation in the knee joint"],a:"b",r:"Calf tenderness in DVT = inflammation from a clot in the deep venous system. Combined with unilateral swelling, warmth, and redness it points to DVT. ALWAYS confirm with Doppler ultrasound."},
{s:"Varicose Veins",q:"How would you best describe a varicose vein?",o:["a. Collapsed and pale from arterial insufficiency","b. Dilated and twisted (tortuous) from incompetent valves","c. Hardened due to calcium deposits in vessel walls","d. Inflamed and infected superficial vein"],a:"b",r:"Varicose veins = DILATED + TWISTED (tortuous) from incompetent venous valves. When valves fail, blood pools and the vein stretches and becomes tortuous. Memory trick: 'various coils': think garden hose left in the sun."},
{s:"Varicose Veins",q:"How does sclerotherapy treat varicose veins?",o:["a. Surgically removes the entire vein","b. An injection collapses and scars the vein","c. A medication dissolves the blood clot","d. A device filters blood to bypass the vein"],a:"b",r:"Sclerotherapy = a sclerosing solution injected into the vein, causing it to collapse and scar, eventually fading. It's an outpatient procedure. Other options: surgical ligation/stripping and IVC filters if thrombosis is present."},
{s:"Buerger's",q:"A nurse is teaching a patient with Buerger's disease. Priority teaching focuses on:",o:["a. Avoiding cold remedies and decongestants","b. Reduction of alcohol intake","c. Cessation of ALL tobacco in any form","d. Weight reduction and low-fat diet"],a:"c",r:"Smoking cessation is the ONLY effective treatment for Buerger's disease. The disease halts with cessation and progresses to amputation without it. ALL tobacco must stop: cigarettes, chew, secondhand smoke, AND nicotine replacement products."},
{s:"Buerger's",q:"What is intermittent claudication?",o:["a. Leg pain at rest that worsens with elevation","b. Leg and foot pain during exercise that is relieved by rest","c. Calf pain elicited on dorsiflexion of the foot","d. Diffuse leg swelling from venous insufficiency"],a:"b",r:"Intermittent claudication = cramping/aching pain during exercise that RESOLVES with rest. Caused by inadequate blood supply during increased oxygen demand. In Buerger's, it often affects the instep (arch of foot): called instep claudication."},
{s:"Buerger's",q:"Which drug is used to treat intermittent claudication?",o:["a. Warfarin (Coumadin)","b. Streptokinase","c. Pentoxifylline (Trental)","d. Dalteparin (Fragmin)"],a:"c",r:"Pentoxifylline (Trental) is used specifically for intermittent claudication in PVD and Buerger's disease. Memory trick: TRENT is always exercising and his legs hurt → TRENTAL is the drug."},
{s:"Buerger's",q:"Most important aspect of compliance to decrease Buerger's disease symptoms?",o:["a. Low fat diet and weight management","b. Weight loss and regular exercise","c. Cessation of ALL tobacco use in any form","d. Keeping extremities warm at all times"],a:"c",r:"Tobacco cessation in ALL forms is the ONLY treatment that halts Buerger's progression. Without cessation: disease progresses → ulceration → infection → amputation."},
{s:"AAA",q:"A patient with known AAA reports sudden severe back pain. The nurse's PRIORITY action is:",o:["a. Reassure the patient it is likely muscle pain","b. Elevate legs and monitor vital signs","c. Call the MD immediately: do not delay","d. Administer pain medication then reassess"],a:"c",r:"Back pain + known AAA = POSSIBLE RUPTURE = EMERGENCY. Call MD IMMEDIATELY. Do NOT reassure, do NOT give pain meds first, do NOT delay. Hypotension + back pain + pulsatile abdominal mass = surgical emergency."},
{s:"AAA",q:"What is the #1 priority assessment for a patient with AAA?",o:["a. Auscultate bowel sounds for bruit","b. Compare blood pressure in BOTH arms","c. Check pedal pulses bilaterally","d. Obtain a 12-lead ECG"],a:"b",r:"Comparing BP in BOTH arms is #1 priority. A significant difference indicates vascular compromise or dissection: the aneurysm may be compressing blood flow to one side."},
{s:"AAA",q:"A patient admitted with possible AAA. Most important factor to monitor for complications?",o:["a. Body temperature for infection","b. Skin turgor for dehydration","c. Respiratory rate for distress","d. Blood pressure: monitor closely"],a:"d",r:"Blood pressure is #1 monitoring priority in AAA. Elevated BP increases wall stress and rupture risk. Always ask: Did the patient take their antihypertensive medications?"},
{s:"Hypertension",q:"What is the key difference between primary and secondary hypertension?",o:["a. Secondary HTN cannot be treated effectively","b. Secondary HTN is caused by another identifiable disorder like renal disease","c. Secondary HTN is related only to hereditary and lifestyle factors","d. Secondary HTN is always less dangerous"],a:"b",r:"Secondary hypertension has an IDENTIFIABLE CAUSE: most commonly renal disease. Primary (essential) HTN has no identifiable cause. Treating the underlying cause in secondary HTN may resolve the hypertension."},
{s:"Hypertension",q:"A PVD patient has been repeatedly noncompliant with medications. The nurse's IMMEDIATE action is:",o:["a. Reteach all medication information again","b. Have a serious talk with the patient and family","c. Arrange for home health visits","d. Collect more information to identify reasons for noncompliance"],a:"d",r:"ALWAYS identify WHY first. Noncompliance has reasons: cost, side effects, confusion, distrust. Teaching before understanding the barrier is ineffective. Assess before intervening: standard nursing principle."},
{s:"Hypertension",q:"The nurse considers that age-related changes affect peripheral circulation because of:",o:["a. Sclerosed (hardened) blood vessels","b. Hypotension from decreased cardiac output","c. Inactivity from reduced mobility","d. Poor nutrition and protein deficiency"],a:"a",r:"Aging causes sclerosis: progressive hardening and loss of elasticity in blood vessels. Sclerosed vessels cannot dilate/contract normally → elevated BP and decreased tissue perfusion → increased PVD susceptibility."},
{s:"Lab Values",q:"What is the CRITICAL PTT range that must be memorized?",o:["a. 10-13 seconds (PT range)","b. 25-35 seconds (aPTT normal)","c. 60-70 seconds (PTT CRITICAL)","d. 0.8-1.2 (INR normal)"],a:"c",r:"PTT 60-70 seconds is the CRITICAL value. Measures INTRINSIC pathway, monitors HEPARIN therapy. Memory trick: PTT = Poke Time (Heparin is injected/IV). High PTT = blood clotting too slowly = bleeding risk → stop Heparin 1 hour, restart at lower rate."},
{s:"Lab Values",q:"What is the therapeutic INR target for a patient on blood thinners?",o:["a. 0.8-1.2 (normal range, not therapeutic)","b. 1.5-2.0 (subtherapeutic)","c. 2.0-3.0 (therapeutic target)","d. 3.0-4.0 (too high for most indications)"],a:"c",r:"INR 2.0-3.0 is the therapeutic anticoagulation target for most Warfarin patients. Normal INR = 0.8-1.2. INR 2-3 means blood takes 2-3x longer to clot: intentionally slowed to prevent clot formation."},
{s:"Lab Values",q:"A patient on Coumadin has an INR result of 5.8. What should the nurse do?",o:["a. Arrange emergency room visit immediately","b. Stop anticoagulant and notify the health care provider","c. Increase leafy green vegetables to lower INR","d. Increase daily fluid intake to dilute the medication"],a:"b",r:"INR 5.8 = DANGEROUSLY HIGH: blood clotting far too slowly. STOP anticoagulant and NOTIFY provider. Do not send to ER unless patient has active bleeding. Leafy greens (Vit K) LOWER INR but stopping the drug comes first."},
{s:"Lab Values",q:"What does the aPTT monitor?",o:["a. Warfarin/Coumadin therapy via extrinsic pathway","b. Heparin therapy: intrinsic pathway","c. Platelet aggregation and function","d. Fibrin clot formation only"],a:"b",r:"aPTT monitors HEPARIN via the intrinsic pathway. Normal aPTT: 25-35 sec. Therapeutic on Heparin: 1.5-2.5x control. Easy memory: PT=Pill (Warfarin is oral), PTT=Poke (Heparin is injected/IV)."},
{s:"Lab Values",q:"A patient's aPTT comes back too elevated. What is the correct nursing action?",o:["a. Increase the heparin dose to compensate","b. Stop Heparin for 1 hour then restart at a lower rate","c. Administer Vitamin K to reverse the effect","d. Hold all anticoagulants permanently"],a:"b",r:"High aPTT = blood clotting TOO SLOWLY = bleeding risk. Protocol: STOP Heparin 1 hour → restart at LOWER rate. Vitamin K reverses Warfarin, not Heparin (Protamine sulfate reverses Heparin)."},
{s:"Lab Values",sata:1,q:"★ SATA: Which factors can ALTER a patient's INR results?",o:["a. Drinking alcohol","b. Vitamin K deficiency","c. Cold temperature exposure","d. Vigorous exercise","e. Caffeine intake"],a:"a,b",r:"Alcohol → RAISES INR (increases anticoagulant effect). Vitamin K deficiency → RAISES INR (less clotting ability). Foods high in Vit K (leafy greens) → LOWER INR. KEY TEACHING: keep Vit K intake CONSISTENT rather than avoiding greens entirely."},
{s:"Coumadin",q:"The nurse reminds a patient on Coumadin to maintain INR between:",o:["a. 3.0 and 4.0","b. 2.0 and 3.0","c. 1.0 and 2.0","d. 4.0 and 5.0"],a:"b",r:"INR 2-3 is the therapeutic target. Below 2.0 = undertreated, clot can form. Above 3.0 = overtreated, bleeding risk increases. Above 5.0 = dangerous, stop medication and notify provider."},
{s:"Coumadin",sata:1,q:"★ SATA: Which are part of the Coumadin safety triad?",o:["a. Use an electric razor only: no blade razors","b. Wear a Medic Alert bracelet at all times","c. Avoid ALL leafy green vegetables forever","d. Report any unusual bleeding immediately","e. Take aspirin daily for additional protection"],a:"a,b,d",r:"Safety triad: Electric razor (a) + Medic Alert bracelet (b) + Report unusual bleeding (d). WRONG: Avoiding all greens: consistency matters more than avoidance. WRONG: Adding aspirin dramatically increases bleeding risk."},
{s:"Coumadin",sata:1,q:"★ SATA: Which information should be taught to a patient starting anticoagulant therapy?",o:["a. Increase aspirin dose for additional anticoagulant effect","b. Take medication at the same time each day","c. Report cuts that do not stop bleeding with direct pressure","d. No restrictions on food or drinks are needed","e. Report for all prescribed blood tests (PTT, INR, CBC)"],a:"b,c,e",r:"Same time daily (b) for consistent levels. Report significant bleeding (c) immediately. Get all labs done (e): daily then weekly then monthly as INR stabilizes. WRONG: Aspirin adds bleeding risk. WRONG: Vit K foods and alcohol DO matter."},
{s:"Pharmacology",q:"A patient on digoxin develops severe nausea and a slow, irregular heartbeat. Which medication caused this toxicity?",o:["a. Captopril (ACE inhibitor)","b. Morphine sulfate (opioid analgesic)","c. Lasix: furosemide (loop diuretic)","d. Aspirin (antiplatelet)"],a:"c",r:"Chain reaction: Lasix → frequent urination → K+ losses → HYPOKALEMIA → potentiates digoxin → TOXICITY. Signs: severe nausea + slow/irregular heartbeat. Rule: Lasix + Digoxin together = ALWAYS monitor potassium closely."},
{s:"Pharmacology",q:"Streptokinase must be given within what time frame after an acute MI?",o:["a. Within 12 hours of symptom onset","b. Within 6 hours: ideally 30 min to 1 hour","c. Within 24 hours of hospital admission","d. Within 48 hours if hemodynamically stable"],a:"b",r:"Streptokinase is a THROMBOLYTIC: it dissolves clots (unlike anticoagulants which only prevent growth). Must be given within 6 hours of acute MI, ideally 30 min-1 hr, to restore blood flow and LIMIT INFARCT SIZE."},
{s:"Pharmacology",q:"How does the nurse know ACE inhibitors are effective in a patient with heart failure?",o:["a. INR is within therapeutic range","b. Patient can perform daily activities WITHOUT supplemental oxygen","c. Blood pressure consistently below 120/80","d. Lower extremity edema resolved by 50%"],a:"b",r:"Effective ACE inhibitors improve tissue perfusion: patient can perform daily activities WITHOUT supplemental oxygen. This is a functional performance indicator showing the heart is pumping effectively enough to meet oxygen demands."},
{s:"Respiratory",q:"Which finger gives the BEST pulse oximetry reading?",o:["a. Pinky finger: most accessible","b. Ring finger: standard practice","c. Index finger: most normal temperature","d. Thumb: largest surface area"],a:"c",r:"Index finger (or whichever has most NORMAL temperature) gives the best reading. Cold fingers give falsely low readings because vasoconstriction reduces blood flow. Nail polish also interferes: it absorbs the light wavelengths used by the oximeter."},
{s:"Respiratory",q:"When should a sputum specimen be collected relative to antibiotic therapy?",o:["a. 2 hours after the first antibiotic dose","b. BEFORE antibiotics are started","c. It doesn't matter: collect anytime","d. 48 hours after antibiotics have begun"],a:"b",r:"Sputum MUST be collected BEFORE antibiotics. Once antibiotics begin killing bacteria, culture results are altered. Also collect BEFORE meals (avoid emesis from coughing) and have patient rinse mouth with water first (removes oral flora contamination)."},
{s:"Respiratory",q:"For how many consecutive mornings are early-morning sputum collections done?",o:["a. 1 morning: one sample is sufficient","b. 2 consecutive mornings","c. 3 consecutive mornings: early AM","d. 5 consecutive mornings"],a:"c",r:"3 consecutive mornings (early AM upon waking) provides the most accurate results. Early morning sputum has the highest bacterial concentration from overnight accumulation. Multiple days catches intermittent organisms missed on a single collection."},
{s:"Respiratory",q:"A dehydrated patient cannot produce sputum. What should the nurse do?",o:["a. Suction the airway immediately with a Yankauer catheter","b. Encourage oral fluid intake; may use hypertonic saline aerosol mist","c. Collect a blood culture as an equivalent substitute","d. Delay collection for 48 hours until the patient rehydrates"],a:"b",r:"Encourage fluids first: dehydration thickens secretions. Hypertonic saline aerosol mist thins and loosens secretions so the patient can raise them. Suctioning is more invasive and used when patient physically cannot cough."},
{s:"Respiratory",q:"A patient is dyspneic with RR 32, pulse 100, coughing frothy red sputum. INITIAL nursing intervention?",o:["a. Lay the patient flat to reduce hypotension","b. Place in side-lying position for atrial fibrillation","c. Place UPRIGHT with legs in dependent position to reduce pulmonary edema","d. Lay flat and elevate feet to increase venous return"],a:"c",r:"Frothy RED sputum + dyspnea + tachycardia = PULMONARY EDEMA. Upright with legs hanging down reduces PRELOAD (venous return to heart) and decreases fluid backing into lungs. Laying flat = MORE fluid to lungs = WORSE."},
{s:"Respiratory",q:"Why is careful IV monitoring especially vital in older adult patients?",o:["a. They do not become dehydrated easily","b. They are at significantly increased risk for fluid overload","c. They are at increased risk for venous line infection","d. Aging causes increased risk for thrombophlebitis"],a:"b",r:"Older adults have DECREASED cardiac reserve and REDUCED kidney function: even moderate IV rates can overwhelm their system → fluid overload → pulmonary edema. Requires careful rate monitoring and frequent reassessment."},
{s:"High-Yield",q:"What is the major cause of cardiac valve disease?",o:["a. Drug abuse causing valve inflammation","b. Long history of malnutrition","c. Rheumatic fever from streptococcal infection","d. Obesity causing pressure on cardiac structures"],a:"c",r:"Rheumatic fever from streptococcal infection is the major cause. The immune response to strep creates antibodies that cross-react with heart valve tissue causing permanent damage. This is why strep throat should always be treated promptly."},
{s:"High-Yield",q:"What diagnostic test is most commonly used to diagnose infective endocarditis?",o:["a. Chest X-ray","b. TEE (Transesophageal Echocardiogram): gold standard","c. 12-lead ECG","d. CT scan of the chest with contrast"],a:"b",r:"TEE is the gold standard for infective endocarditis. It detects thrombi, vegetation on heart valves, and abscesses on valve structures. Superior to transthoracic echo because the transducer sits in the esophagus right behind the heart."},
{s:"High-Yield",q:"Which intervention is appropriate for a patient experiencing thrombocytopenia?",o:["a. Request an aspirin order for pain relief","b. Trim toenails very close to prevent ingrown nails","c. Use an electric razor: no blade razors","d. Encourage vigorous daily exercise"],a:"c",r:"Thrombocytopenia = LOW PLATELETS = HIGH BLEEDING RISK. Electric razor (c) prevents cuts that won't stop bleeding. WRONG: Aspirin inhibits platelet aggregation further. WRONG: Toenail trimming risks cutting skin. WRONG: Vigorous exercise risks injury and internal bleeding."},

uid first."},

let qs=[...ALL_Q],cur=0,answered={},score=0,sataSel={},currentFilter='all';

// ── PASSCODE ──
function checkPC(){
  if(document.getElementById('pc').value==='2027'){
    const gate=document.getElementById('gate');
    gate.style.animation='fadeIn .3s ease reverse';
    setTimeout(()=>{gate.style.display='none'; renderAll(); showFunFact();},280);
  } else {
    const e=document.getElementById('pcErr');
    e.style.display='block';e.style.animation='wrongShake .3s ease';
    document.getElementById('pc').value='';
    setTimeout(()=>{e.style.display='none';},2800);
  }
}

// ── SHUFFLE ──
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ── FILTER ──
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  qs=f==='all'?[...ALL_Q]:ALL_Q.filter(q=>q.s===f);
  shuffle(qs);answered={};score=0;cur=0;sataSel={};
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('quizContainer').style.display='block';
  document.getElementById('nextBtn').disabled=false;
  renderAll();
  showFunFact();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── RENDER ALL QUESTIONS ──
function renderAll(){
  // Group questions by section
  const sections=[...new Set(qs.map(q=>q.s))];
  let html='';
  let globalIdx=0;

  sections.forEach(sec=>{
    const secQs=qs.map((q,i)=>({q,i})).filter(({q})=>q.s===sec);
    const meta=SEC_META[sec]||{icon:'📋',desc:''};
    const total=secQs.length;
    const doneCount=secQs.filter(({i})=>answered[i]!==undefined).length;

    html+=`<div class="section-header" id="sec-${sec.replace(/[^a-z]/gi,'_')}">
      <div class="section-icon">${meta.icon}</div>
      <div class="section-info">
        <div class="section-name">${sec}</div>
        <div class="section-desc">${meta.desc}</div>
      </div>
      <div class="section-badge" id="secbadge-${sec.replace(/[^a-z]/gi,'_')}">${doneCount}/${total}</div>
    </div>`;

    secQs.forEach(({q,i})=>{
      html+=buildCard(q,i);
    });
  });

  document.getElementById('quizContainer').innerHTML=html;
  updateProgress();
}

// ── BUILD SINGLE CARD ──
function buildCard(q,id){
  const isAns=answered[id]!==undefined;
  const isSATA=!!q.sata;
  const sel=sataSel[id]||[];
  const cList=q.a.split(',').map(s=>s.trim());
  const cardCls=isAns?(answered[id].correct?'correct':'wrong'):'';
  const num=id+1;

  let opts='';
  q.o.forEach(opt=>{
    const l=opt[0].toLowerCase();
    const isC=cList.includes(l);
    const wasSel=isSATA?(answered[id]||{picks:[]}).picks?.includes(l):(answered[id]||{}).picks===l;
    let cls='opt',letter=l.toUpperCase();
    if(isAns){
      cls+=' locked';
      if(isC){cls+=' is-correct';letter='✓';}
      else if(wasSel){cls+=' is-wrong';letter='✗';}
    } else if(isSATA&&sel.includes(l)){cls+=' sel';}
    const fn=isAns?'':(isSATA?` onclick="ts(${id},'${l}')"`:` onclick="as(${id},'${l}')" `);
    opts+=`<button class="${cls}"${fn}>
      <span class="opt-letter">${letter}</span>
      <span class="opt-text">${opt.substring(3)}</span>
    </button>`;
  });

  const hint=isSATA&&!isAns?`<div class="sata-hint">⭐ Select ALL that apply — tap again to deselect</div>`:'';

  const submitRow=isSATA&&!isAns?`
    <div class="submit-row">
      <button class="submit-btn" id="sub${id}" onclick="ss(${id})"${sel.length===0?' disabled':''}>
        Submit →
      </button>
      <span class="submit-hint">${sel.length===0?'Select an answer to submit':`${sel.length} option${sel.length>1?'s':''} selected`}</span>
    </div>`:
    (!isAns&&!isSATA)?`
    <div class="submit-row">
      <button class="submit-btn" disabled>Submit →</button>
      <span class="submit-hint">Select an answer to submit</span>
    </div>`:'';

  let banner='';
  if(isAns){
    if(answered[id].correct){
      banner='<div class="result-banner correct-banner show">✅ Correct! Well done.</div>';
    } else {
      const cd=cList.map(l=>l.toUpperCase()).join(', ');
      banner=`<div class="result-banner wrong-banner show">❌ Incorrect — correct: <strong>${cd}</strong></div>`;
    }
  }

  const rat=isAns?`<div class="rationale show">
    <div class="rat-label">📋 Clinical Rationale</div>
    ${q.r}
  </div>`:'';

  const sataTag=isSATA?`<span class="q-type-tag">★ SATA</span>`:'';
  const imgHtml=q.img?`<div class="q-img-wrap"><img src="${q.img}" alt="Respiratory anatomy diagram"/><div class="q-img-label">📷 Study the diagram — then answer below</div></div>`:'';

  return `<div class="q-card ${cardCls}" id="qcard${id}" style="animation-delay:${(id%8)*0.04}s">
    <div class="q-accent"></div>
    <div class="q-inner">
      <div class="q-head">
        <div class="q-badge">${num}</div>
        <div class="q-meta">
          <span class="q-section-tag">${q.s}</span>${sataTag}${q.img?'<span class="q-type-tag" style="background:#e0f2fe;color:#0284c7;border-color:#7dd3fc">🖼 Diagram</span>':''}
        </div>
      </div>
      ${imgHtml}
      <div class="q-text">${q.q}</div>
      ${hint}
      <div class="q-opts">${opts}</div>
      ${submitRow}
      ${banner}
      ${rat}
    </div>
  </div>`;
}

// ── REFRESH A SINGLE CARD IN PLACE ──
function refreshCard(id){
  const q=qs[id];
  const el=document.getElementById('qcard'+id);
  if(!el)return;
  const newEl=document.createElement('div');
  newEl.innerHTML=buildCard(q,id);
  const newCard=newEl.firstElementChild;
  el.replaceWith(newCard);
  updateProgress();
  updateSectionBadges();
}

// ── ANSWER SINGLE ──
function as(id,l){
  if(answered[id]!==undefined)return;
  const correct=qs[id].a.trim()===l;
  answered[id]={picks:l,correct};
  if(correct)score++;
  refreshCard(id);
}

// ── TOGGLE SATA ──
function ts(id,l){
  if(answered[id]!==undefined)return;
  if(!sataSel[id])sataSel[id]=[];
  const i=sataSel[id].indexOf(l);
  if(i>=0)sataSel[id].splice(i,1);
  else sataSel[id].push(l);
  refreshCard(id);
}

// ── SUBMIT SATA ──
function ss(id){
  const sel=sataSel[id]||[];
  if(!sel.length)return;
  const cList=qs[id].a.split(',').map(s=>s.trim()).sort();
  const correct=JSON.stringify([...sel].sort())===JSON.stringify(cList);
  answered[id]={picks:sel,correct};
  if(correct)score++;
  refreshCard(id);
}

// ── SECTION BADGE UPDATE ──
function updateSectionBadges(){
  const sections=[...new Set(qs.map(q=>q.s))];
  sections.forEach(sec=>{
    const key=sec.replace(/[^a-z]/gi,'_');
    const el=document.getElementById('secbadge-'+key);
    if(!el)return;
    const secQs=qs.map((q,i)=>({q,i})).filter(({q})=>q.s===sec);
    const done=secQs.filter(({i})=>answered[i]!==undefined).length;
    el.textContent=`${done}/${secQs.length}`;
    if(done===secQs.length&&secQs.length>0){
      el.style.background='rgba(52,211,153,.3)';
      el.style.color='#a7f3d0';
    }
  });
}

// ── PROGRESS UPDATE ──
function updateProgress(){
  const tot=qs.length;
  const done=Object.keys(answered).length;
  const pct=Math.round((done/tot)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLabel').textContent=`${done} of ${tot} answered`;
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('scoreOf').textContent=done;

  if(done===tot&&tot>0){
    setTimeout(showResults,600);
  }
}

// ── NAV (for compatibility — scrolls to next unanswered) ──
function go(d){
  // Find next unanswered question
  let target=-1;
  if(d>0){
    for(let i=0;i<qs.length;i++){
      if(answered[i]===undefined){target=i;break;}
    }
  }
  if(target>=0){
    const el=document.getElementById('qcard'+target);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  } else {
    showResults();
  }
}

// ── RESULTS SCREEN ──
function showResults(){
  document.getElementById('quizContainer').style.display='none';
  const tot=qs.length,done=Object.keys(answered).length;
  const pct=Math.round((score/tot)*100),wrong=done-score;
  const e=pct>=90?'🏆':pct>=80?'💪':pct>=70?'📚':'🔄';
  const m=pct>=90?'Excellent work!':pct>=80?'Strong performance!':pct>=70?'Keep studying!':'Review your notes.';
  document.getElementById('resultsScreen').innerHTML=`
    <span class="results-emoji">${e}</span>
    <div class="results-pct">${pct}%</div>
    <div class="results-label">${m} — ${score} correct out of ${tot} questions</div>
    <div class="results-grid">
      <div class="rb c"><div class="rb-v">${score}</div><div class="rb-l">Correct</div></div>
      <div class="rb w"><div class="rb-v">${wrong}</div><div class="rb-l">Wrong</div></div>
      <div class="rb t"><div class="rb-v">${tot}</div><div class="rb-l">Total</div></div>
    </div>
    <button class="restart-btn" onclick="resetQuiz()">↺ Try Again</button>`;
  document.getElementById('resultsScreen').classList.add('show');
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('prevBtn').disabled=true;
  document.getElementById('progFill').style.width='100%';
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('scoreOf').textContent=tot;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── RESET ──
function randomizeQuiz(){
  // Shuffle ALL questions regardless of filter
  qs=[...ALL_Q];
  shuffle(qs);
  answered={};score=0;cur=0;sataSel={};
  currentFilter='all';
  document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));
  document.getElementById('randomBtn').classList.add('on');
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('quizContainer').style.display='block';
  document.getElementById('nextBtn').disabled=false;
  renderAll();
  showFunFact();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz(){
  answered={};score=0;cur=0;sataSel={};
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('quizContainer').style.display='block';
  document.getElementById('nextBtn').disabled=false;
  shuffle(qs);renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── BUILD FILTER CHIPS ──
const uniqueSecs = [...new Set(ALL_Q.map(q => q.s))];

uniqueSecs.forEach(sec => {
  const cnt = ALL_Q.filter(q => q.s === sec).length;
  const meta = SEC_META[sec] || {icon:'📋'};
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = `${meta.icon} ${sec} (${cnt})`;
  btn.onclick = () => setFilter(sec, btn);
  document.getElementById('filterBar').appendChild(btn);
});
